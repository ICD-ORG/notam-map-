name: משיכת נתוני בדיקה אמיתיים (OpenStreetMap)

on:
  workflow_dispatch:
    inputs:
      args:
        description: 'ארגומנטים לסקריפט (למשל --parts=ext או --force)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  fixtures:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: משיכה
        run: node scripts/fetch_fixtures.mjs ${{ inputs.args }}
      - name: שמירה בענף
        if: always()
        run: |
          git config user.name "notam-bot"
          git config user.email "bot@users.noreply.github.com"
          git add tests/fixtures
          if git diff --cached --quiet; then echo "אין שינוי"; else
            git commit -m "נתוני בדיקה אמיתיים מ-OpenStreetMap (עדכון אוטומטי)"
            git pull --rebase origin "${{ github.ref_name }}"
            git push
          fi
