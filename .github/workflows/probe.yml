name: בדיקת נתוני OSM (חד-פעמית)

on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/probe_balloon.mjs
      - name: שמירה בענף
        if: always()
        run: |
          git config user.name "notam-bot"
          git config user.email "bot@users.noreply.github.com"
          git add tests/fixtures/probe
          if git diff --cached --quiet; then echo "אין שינוי"; else
            git commit -m "תוצאות בדיקת נתוני OSM"
            git pull --rebase -X theirs origin "${{ github.ref_name }}"
            git push
          fi
