name: בדיקות (יחידה + דפדפן + הרצה חיה)

on:
  push:
    branches: ['claude-icd/**']
    paths:
      - 'request/**'
      - 'request.html'
      - 'tests/**.mjs'
      - 'tests/expected.json'
      - 'data/request-config.json'
      - '.github/workflows/tests.yml'
  pull_request:
    paths:
      - 'request/**'
      - 'request.html'
      - 'tests/**'
      - 'data/**'
  workflow_dispatch:
    inputs:
      from:
        description: 'תאריך התחלה לדוגמה (YYYY-MM-DD)'
        required: false
        default: ''
      to:
        description: 'תאריך סיום לדוגמה (YYYY-MM-DD)'
        required: false
        default: ''
      site:
        description: 'שם אתר לדוגמה'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mock:
    name: יחידה + דפדפן עם נתוני אמת שמורים
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/core.test.mjs
      - name: התקנת Playwright
        run: |
          npm init -y >/dev/null
          npm i playwright@1.49.1
          npx playwright install --with-deps chromium
      - name: בדיקת דפדפן מלאה (נתונים שמורים)
        run: node tests/e2e.mjs tests/out-mock

  live:
    name: הרצה חיה (Overpass, Nominatim, תצלום אוויר אמיתי)
    runs-on: ubuntu-latest
    needs: mock
    if: github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: התקנת Playwright
        run: |
          npm init -y >/dev/null
          npm i playwright@1.49.1
          npx playwright install --with-deps chromium
      - name: הרצה חיה
        run: E2E_LIVE=1 E2E_FROM='${{ inputs.from }}' E2E_TO='${{ inputs.to }}' E2E_SITE='${{ inputs.site }}' node tests/e2e.mjs tests/out-live
      - name: שמירת התוצרים בענף (בהרצה ידנית בלבד)
        if: always() && github.event_name == 'workflow_dispatch'
        run: |
          git config user.name "notam-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -f tests/out-live
          if git diff --cached --quiet; then echo "אין שינוי"; else
            git commit -m "תוצרי הרצה חיה של הבדיקות"
            git pull --rebase -X theirs origin "${{ github.ref_name }}"
            git push
          fi
