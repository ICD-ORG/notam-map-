name: בדיקת עדכון פמ"ת א-17 (רבעוני)

on:
  schedule:
    # ב-1 בינואר / אפריל / יולי / אוקטובר ב-05:17 UTC (08:17 שעון ישראל בקיץ, 07:17 בחורף)
    - cron: '17 5 1 1,4,7,10 *'
  workflow_dispatch: {}   # אפשר גם להריץ ידנית בלחיצת כפתור

permissions:
  contents: write
  issues: write

concurrency:
  group: a17-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: משיכת הקוד
        uses: actions/checkout@v4

      - name: התקנת Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: התקנת pdftotext
        run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils

      - name: בדיקה מול אתר רת"א
        env:
          GH_TOKEN: ${{ github.token }}
          # אופציונלי: מייל ישיר (בנוסף למייל ש-GitHub שולח על Issue חדש). אם לא הוגדרו — מדלגים.
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
        run: python scripts/a17_check.py

      - name: שמירת קובץ המקור בריפו
        run: |
          git config user.name "notam-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/source
          if git diff --cached --quiet; then
            echo "אין קבצים חדשים לשמירה"
          else
            git commit -m "פמ\"ת א-17: שמירת קובץ מקור $(date -u +'%d/%m/%Y')"
            git pull --rebase origin "${{ github.ref_name }}"
            git push
          fi
