name: סריקת סביבה — בדיקה חד-פעמית

on:
  push:
    branches: ['claude-icd/**']
    paths:
      - 'scripts/area_scan_fetch.py'
      - '.github/workflows/area-scan-test.yml'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: משיכת הקוד
        uses: actions/checkout@v4

      - name: התקנת Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: משיכת נתוני סביבה סביב נקודת הירקון
        run: python scripts/area_scan_fetch.py --lat 32.099128 --lon 34.816617 --out data/source/scan-test

      - name: שמירת התוצאות בענף
        if: always()
        run: |
          git config user.name "notam-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/source/scan-test
          if git diff --cached --quiet; then
            echo "אין קבצים לשמירה"
          else
            git commit -m "נתוני בדיקת סריקה (OpenStreetMap) — נקודת הירקון"
            git pull --rebase origin "${{ github.ref_name }}"
            git push
          fi
