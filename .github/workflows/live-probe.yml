name: בדיקת תקשורת חיה (דפדפן אמיתי)

on:
  push:
    branches: ['claude-icd/**']
    paths:
      - 'tests/live-probe.mjs'
      - '.github/workflows/live-probe.yml'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: התקנת Playwright
        run: |
          npm init -y >/dev/null
          npm i playwright@1.49.1
          npx playwright install --with-deps chromium
      - name: בדיקה
        run: node tests/live-probe.mjs data/source/live-probe
      - name: שמירת התוצאה בענף
        if: always()
        run: |
          git config user.name "notam-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/source/live-probe
          if git diff --cached --quiet; then echo "אין שינוי"; else
            git commit -m "תוצאת בדיקת תקשורת חיה"
            git pull --rebase origin "${{ github.ref_name }}"
            git push
          fi
