name: אבחון מקור הנוטמים (חד-פעמי)

# בדיקה חד-פעמית: איך האתר החדש של רש"ת מגיש את הנוטמים לדפדפן רגיל. רק קריאה — לא כותב שום קובץ ולא משנה נתונים.
on:
  push:
    branches: [claude-icd/adoring-goodall-fg84sg]
    paths: ['.github/workflows/notam-source-diag.yml']
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: דף הבית של האתר החדש (curl)
        run: |
          curl -sS -m 60 -L -D /tmp/h.txt -o /tmp/index.html -w 'code=%{http_code} size=%{size_download} url=%{url_effective}\n' -A 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) Chrome/124.0 Safari/537.36' https://aeroinfo.iaa.gov.il/ || echo "rc=$?"
          head -30 /tmp/h.txt | cut -c1-200
          echo '--- גוף'; head -c 1800 /tmp/index.html
          echo; echo '--- /Client/index.html'
          curl -sS -m 60 -o /tmp/client.html -w 'code=%{http_code} size=%{size_download}\n' -A 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) Chrome/124.0 Safari/537.36' https://aeroinfo.iaa.gov.il/Client/index.html || echo "rc=$?"
          head -c 2500 /tmp/client.html
          echo; echo '--- סקריפטים בדף'; grep -o 'src="[^"]*"' /tmp/client.html | head -20

      - name: דפדפן אמיתי (Chrome + Playwright) — מה נטען ואילו קריאות נשלחות
        run: |
          pip install -q playwright
          python3 - <<'PY'
          import json, re
          from playwright.sync_api import sync_playwright
          reqs=[]
          with sync_playwright() as p:
              b=p.chromium.launch(channel='chrome', headless=True, args=['--no-sandbox'])
              ctx=b.new_context(locale='he-IL', viewport={'width':1280,'height':900})
              pg=ctx.new_page()
              def on_resp(r):
                  try:
                      rt=r.request.resource_type
                      if rt in ('xhr','fetch','document'):
                          ct=r.headers.get('content-type','')
                          body=''
                          try: body=r.text()[:600] if ('json' in ct or 'text' in ct or 'xml' in ct) else ''
                          except Exception: pass
                          reqs.append((rt,r.request.method,r.status,r.url[:200],ct[:50],body))
                  except Exception as e: reqs.append(('err',str(e)))
              pg.on('response',on_resp)
              try:
                  pg.goto('https://aeroinfo.iaa.gov.il/', wait_until='networkidle', timeout=60000)
              except Exception as e: print('goto:',type(e).__name__,str(e)[:200])
              pg.wait_for_timeout(8000)
              print('TITLE:',pg.title()); print('URL:',pg.url)
              txt=pg.inner_text('body') if pg.query_selector('body') else ''
              print('TEXT (900):',txt[:900].replace('\n',' | '))
              links=pg.eval_on_selector_all('a,button,[role=tab],[role=menuitem]','els=>els.map(e=>(e.innerText||e.getAttribute("aria-label")||"").trim()).filter(Boolean).slice(0,60)')
              print('LINKS/BUTTONS:',links)
              print('--- RESPONSES (document/xhr/fetch):')
              for r in reqs: print(json.dumps(r,ensure_ascii=False)[:900])
              b.close()
          PY
