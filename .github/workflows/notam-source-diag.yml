name: אבחון מקור הנוטמים (חד-פעמי)

# בדיקה חד-פעמית: מה מוחזר מכתובת הנוטמים החדשה של רש"ת. רק קריאה — לא כותב שום קובץ ולא משנה נתונים.
on:
  push:
    branches: [claude-icd/adoring-goodall-fg84sg]
    paths: ['.github/workflows/notam-source-diag.yml']
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: curl לכתובת החדשה
        run: |
          URL='https://aeroinfo.iaa.gov.il/Notams'
          curl -sS -m 60 -D /tmp/h.txt -o /tmp/n.html -w 'code=%{http_code} size=%{size_download} redirect=%{redirect_url}\n' -A 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) Chrome/124.0 Safari/537.36' "$URL" || echo "rc=$?"
          grep -iE '^(HTTP|location|content-type|server)' /tmp/h.txt | head
          echo '--- גוף'; head -c 1200 /tmp/n.html | sed 's/__uzdbm_[0-9] = "[^"]*"/__uzdbm_x=[..]/g'
      - name: דפדפן אמיתי — האם הדף נטען או מוצג אתגר
        run: |
          pip install -q playwright
          python3 - <<'PY'
          import json
          from playwright.sync_api import sync_playwright
          out=[]
          with sync_playwright() as p:
              b=p.chromium.launch(channel='chrome', headless=True, args=['--no-sandbox'])
              pg=b.new_context(locale='he-IL',viewport={'width':1280,'height':900}).new_page()
              pg.on('response',lambda r: out.append((r.request.resource_type,r.status,r.url[:150])) if r.request.resource_type in('document','xhr','fetch') else None)
              try: pg.goto('https://aeroinfo.iaa.gov.il/Notams',wait_until='networkidle',timeout=60000)
              except Exception as e: print('goto:',type(e).__name__)
              pg.wait_for_timeout(6000)
              print('TITLE:',pg.title()); print('URL:',pg.url[:160])
              print('TEXT:',pg.inner_text('body')[:700].replace('\n',' | '))
              for o in out[:25]: print(o)
              b.close()
          PY
